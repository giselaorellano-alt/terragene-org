<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Organigrama Terragene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<style>
  :root{
    --bg:#F3F4F7;
    --surface:#FFFFFF;
    --surface-2:#F8F9FB;
    --border:#E3E6EC;
    --border-strong:#D3D7E0;
    --text:#1B2130;
    --text-muted:#6B7280;
    --text-faint:#9AA1AF;
    --accent-orange:#FF7A45;
    --accent-orange-ink:#FFFFFF;
    --accent-blue:#3559E0;
    --accent-blue-soft:#EDF1FE;
    --pill-bg:#F1F2F5;
    --pill-ink:#495066;
    --connector:#D6DAE3;
    --shadow:0 1px 2px rgba(20,24,36,.04), 0 1px 1px rgba(20,24,36,.03);
    --shadow-hover:0 6px 16px rgba(20,24,36,.10), 0 2px 6px rgba(20,24,36,.06);
    --match-ring:#FF7A45;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#13151A;
      --surface:#1B1E25;
      --surface-2:#20232B;
      --border:#2B2F3A;
      --border-strong:#383D4A;
      --text:#EDEEF2;
      --text-muted:#9CA3B4;
      --text-faint:#6E7486;
      --accent-orange:#FF8B5E;
      --accent-orange-ink:#1B1204;
      --accent-blue:#7C97FF;
      --accent-blue-soft:#232A44;
      --pill-bg:#262A33;
      --pill-ink:#C2C7D4;
      --connector:#333947;
      --shadow:0 1px 2px rgba(0,0,0,.3);
      --shadow-hover:0 8px 20px rgba(0,0,0,.45);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#13151A;
    --surface:#1B1E25;
    --surface-2:#20232B;
    --border:#2B2F3A;
    --border-strong:#383D4A;
    --text:#EDEEF2;
    --text-muted:#9CA3B4;
    --text-faint:#6E7486;
    --accent-orange:#FF8B5E;
    --accent-orange-ink:#1B1204;
    --accent-blue:#7C97FF;
    --accent-blue-soft:#232A44;
    --pill-bg:#262A33;
    --pill-ink:#C2C7D4;
    --connector:#333947;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    --shadow-hover:0 8px 20px rgba(0,0,0,.45);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html,body{overflow-x:hidden;max-width:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    padding-inline:0;
  }
  h1,h2,.name,.root-title{font-family:'Plus Jakarta Sans', system-ui, sans-serif;}

  /* ---------- header ---------- */
  .page-header{
    position:sticky;
    top:env(safe-area-inset-top, 0px);
    z-index:40;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:14px 16px;
  }
  .header-row{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    max-width:1400px;
    margin:0 auto;
    min-width:0;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
    flex-shrink:1;
  }
  .brand-badge{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(155deg,var(--accent-orange),#E85B26);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:13px;letter-spacing:.02em;
    flex:none;
  }
  .brand-text h1{
    font-size:16px;font-weight:700;margin:0;line-height:1.15;
    white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:100%;
  }
  .brand-text p{
    margin:1px 0 0;font-size:12px;color:var(--text-muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .search-wrap{
    flex:1 1 220px;
    min-width:0;
    position:relative;
  }
  .search-wrap input{
    width:100%;
    min-width:0;
    font:inherit;
    font-size:13.5px;
    padding:9px 34px 9px 34px;
    border-radius:9px;
    border:1px solid var(--border-strong);
    background:var(--surface-2);
    color:var(--text);
    outline:none;
  }
  .search-wrap input:focus{
    border-color:var(--accent-blue);
    box-shadow:0 0 0 3px var(--accent-blue-soft);
  }
  .search-icon{
    position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:15px;height:15px;color:var(--text-faint);pointer-events:none;
  }
  .search-clear{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    border:none;background:none;color:var(--text-faint);cursor:pointer;
    width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  }
  .search-clear:hover{background:var(--pill-bg);color:var(--text);}
  .search-count{
    font-size:11.5px;color:var(--text-muted);
    position:absolute;right:32px;top:50%;transform:translateY(-50%);
    white-space:nowrap;
  }
  .toolbar-btns{display:flex;gap:8px;flex:none;flex-wrap:wrap;}
  .btn{
    font:inherit;font-size:12.5px;font-weight:600;
    padding:8px 12px;border-radius:8px;border:1px solid var(--border-strong);
    background:var(--surface);color:var(--text);cursor:pointer;
    white-space:nowrap;
    transition:background .12s ease, border-color .12s ease;
  }
  .btn:hover{background:var(--surface-2);border-color:var(--text-faint);}
  .btn:disabled{opacity:.6;cursor:wait;}
  .btn-primary{
    background:var(--accent-blue);border-color:var(--accent-blue);color:#fff;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn-primary:hover{background:var(--accent-blue);opacity:.9;border-color:var(--accent-blue);}
  .btn-primary svg{width:13px;height:13px;flex:none;}
  .stats-row{
    max-width:1400px;margin:10px auto 0;
    display:flex;gap:18px;flex-wrap:wrap;
    font-size:12px;color:var(--text-muted);
    padding:0 2px;
  }
  .stats-row b{color:var(--text);font-weight:700;}
  .pdf-status{
    max-width:1400px;margin:6px auto 0;font-size:11.5px;color:var(--text-muted);
    padding:0 2px;
  }
  /* html2canvas renders multi-layer box-shadow as a solid block on some cards;
     drop shadows while capturing for export, a thin border still separates the cards */
  body.pdf-exporting .card{box-shadow:none;}
  body.pdf-exporting .card.is-match{box-shadow:0 0 0 2px var(--match-ring);}
  body.pdf-exporting .avatar{box-shadow:none;}

  /* ---------- canvas ---------- */
  .canvas{
    overflow:auto;
    padding:56px 40px 90px;
    min-height:60vh;
  }
  .zoom-wrap{
    display:inline-flex;
    /* plain "center" makes overflowing content unreachable by scroll in flexbox
       (the classic flex "safe/unsafe" alignment gotcha) — "safe center" falls
       back to start-alignment once content overflows, so nothing gets clipped */
    justify-content:center;
    justify-content:safe center;
    width:100%;
    transform-origin:top center;
  }

  /* ---------- tree ---------- */
  ul.tree, ul.tree ul{
    list-style:none;margin:0;padding:0;
    display:flex;
  }
  ul.tree{justify-content:center;justify-content:safe center;}
  ul.tree ul{padding-top:32px;position:relative;}
  li.node{
    display:flex;flex-direction:column;align-items:center;
    position:relative;padding:32px 16px 0 16px;
  }
  li.node::before, li.node::after{
    content:'';position:absolute;top:0;width:50%;height:32px;
    border-top:2px solid var(--connector);
  }
  li.node::before{right:50%;}
  li.node::after{left:50%;border-left:2px solid var(--connector);}
  li.node:first-child::before{border:none;}
  li.node:last-child::after{border:none;}
  li.node:first-child:not(:last-child)::after{border-radius:8px 0 0 0;}
  li.node:last-child:not(:first-child)::before{border-radius:0 8px 0 0;}
  li.node:only-child{padding-top:0;}
  li.node:only-child::before, li.node:only-child::after{display:none;}
  li.node.is-root{padding-top:0;}
  li.node.is-root::before, li.node.is-root::after{display:none;}

  /* ---------- card ---------- */
  .card{
    position:relative;
    width:238px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:30px 14px 12px;
    text-align:center;
    flex:none;
  }
  .card.clickable{cursor:pointer;}
  .card.clickable:hover{box-shadow:var(--shadow-hover);border-color:var(--border-strong);}
  .card.is-match{box-shadow:0 0 0 2px var(--match-ring), var(--shadow-hover);}
  .card:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;}

  .avatar{
    position:absolute;top:-24px;left:50%;transform:translateX(-50%);
    width:48px;height:48px;border-radius:50%;
    background:var(--accent-orange);color:var(--accent-orange-ink);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14.5px;letter-spacing:.01em;
    border:3px solid var(--surface);
    box-shadow:0 1px 3px rgba(0,0,0,.12);
  }
  .eyebrow{
    font-size:10.5px;font-weight:700;color:var(--accent-blue);
    text-transform:uppercase;letter-spacing:.05em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:3px;
  }
  .name{
    font-size:13px;font-weight:700;color:var(--text);
    line-height:1.28;
    margin-bottom:2px;
    word-break:break-word;
  }
  .role{
    font-size:11.5px;color:var(--text);opacity:.82;
    line-height:1.3;margin-bottom:3px;
    word-break:break-word;
  }
  .email{
    font-size:10.5px;color:var(--text-muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:10px;
  }
  .meta-row{
    display:flex;align-items:center;justify-content:space-between;
    gap:6px;margin-top:auto;
  }
  .years-pill{
    font-size:10.5px;font-weight:600;color:var(--pill-ink);
    background:var(--pill-bg);border-radius:100px;
    padding:3px 9px;white-space:nowrap;
  }
  .years-pill.placeholder{visibility:hidden;}
  .reports-badge{
    display:flex;align-items:center;gap:4px;
    font-size:11px;font-weight:700;color:var(--accent-blue);
    background:var(--accent-blue-soft);border-radius:100px;
    padding:3px 8px 3px 6px;white-space:nowrap;
  }
  .reports-badge svg{width:12px;height:12px;}
  .chev{
    width:11px;height:11px;transition:transform .15s ease;flex:none;
  }
  .chev.open{transform:rotate(90deg);}

  /* root card variant */
  .card.root-card{
    width:220px;padding:26px 14px 16px;
  }
  .avatar.root-avatar{background:var(--accent-orange);}
  .root-title{
    font-size:13.5px;font-weight:800;color:var(--text);
    margin-bottom:12px;
  }

  .no-children-spacer{height:2px;}

  .empty-state{
    text-align:center;color:var(--text-muted);font-size:13px;
    padding:60px 20px;
  }

  /* ---------- zoom controls ---------- */
  .zoom-controls{
    position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom, 0px));
    display:flex;flex-direction:column;
    background:var(--surface);border:1px solid var(--border);
    border-radius:10px;box-shadow:var(--shadow-hover);
    overflow:hidden;z-index:30;
  }
  .zoom-controls button{
    width:36px;height:36px;border:none;background:none;color:var(--text);
    font-size:16px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .zoom-controls button:hover{background:var(--surface-2);}
  .zoom-controls button + button{border-top:1px solid var(--border);}
  .zoom-level{
    font-size:10px;color:var(--text-muted);text-align:center;
    padding:4px 0;border-top:1px solid var(--border);
  }

  @media (max-width:640px){
    .header-row{align-items:flex-start;}
    .brand{flex:1 1 100%;}
    .brand-text p{display:none;}
    .search-wrap{flex:1 1 100%;order:3;}
    .toolbar-btns{width:100%;order:4;}
    .btn{flex:1;}
    .canvas{padding:40px 14px 90px;}
  }

  /* ---------- print / PDF export ---------- */
  @media print{
    :root, :root[data-theme="dark"]{
      --bg:#FFFFFF;
      --surface:#FFFFFF;
      --surface-2:#F8F9FB;
      --border:#E3E6EC;
      --border-strong:#D3D7E0;
      --text:#1B2130;
      --text-muted:#585F6E;
      --text-faint:#7A8092;
      --accent-orange:#FF7A45;
      --accent-orange-ink:#FFFFFF;
      --accent-blue:#3559E0;
      --accent-blue-soft:#EDF1FE;
      --pill-bg:#F1F2F5;
      --pill-ink:#495066;
      --connector:#B9BFCC;
    }
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
    html,body{overflow:visible!important;background:#fff!important;}
    .page-header{position:static;box-shadow:none;}
    .search-wrap,.toolbar-btns,.stats-row .print-hide{display:none!important;}
    .zoom-controls{display:none!important;}
    .canvas{overflow:visible!important;padding:0!important;min-height:0;}
    .zoom-wrap{transform:none!important;}
    li.node{break-inside:avoid;}
    .card{break-inside:avoid;box-shadow:none;}
    @page{size:landscape;margin:10mm;}
  }
</style>

<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('org-data').textContent);
  var ROOT_ID = DATA.id;

  // index all nodes
  var byId = {};
  var allIds = [];
  var idsWithChildren = [];
  (function index(n, depth){
    n.__depth = depth;
    byId[n.id] = n;
    allIds.push(n.id);
    if(n.children && n.children.length){ idsWithChildren.push(n.id); }
    (n.children||[]).forEach(function(c){ index(c, depth+1); });
  })(DATA, 0);

  function countAll(n){
    var c = 1;
    (n.children||[]).forEach(function(k){ c += countAll(k); });
    return c;
  }
  var totalPeople = countAll(DATA) - 1; // exclude synthetic root
  var deptSet = {};
  allIds.forEach(function(id){ var n = byId[id]; if(n.dept) deptSet[n.dept] = true; });
  var deptCount = Object.keys(deptSet).length;

  document.getElementById('statsRow').innerHTML =
    '<span><b>' + totalPeople + '</b> personas</span>' +
    '<span><b>' + deptCount + '</b> departamentos</span>' +
    '<span><b>' + (byId[ROOT_ID].children.length) + '</b> reportan directo a la dirección</span>';

  // ---- expand state ----
  var expanded = {};
  expanded[ROOT_ID] = true;
  byId[ROOT_ID].children.forEach(function(c){
    expanded[c.id] = true;                 // level 1 (e.g. CEO) open
    (c.children||[]).forEach(function(g){ expanded[g.id] = true; }); // their direct reports open, grandchildren closed
  });

  var query = '';
  var matchIds = {};
  var forcedOpen = {};

  function norm(s){
    return (s||'').toString().toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g,'');
  }

  function svgPeople(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="3.5"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/><path d="M15.5 3.6a4 4 0 0 1 0 7.8"/></svg>';
  }
  function svgChevron(open){
    return '<svg class="chev' + (open?' open':'') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  }

  function renderCard(node, isRoot){
    var hasKids = node.children && node.children.length > 0;
    var isOpen = isRoot ? true : !!expanded[node.id];
    var isMatch = query && matchIds[node.id];

    if(isRoot){
      return '' +
        '<div class="card root-card' + (hasKids ? ' clickable' : '') + '" ' +
          (hasKids ? 'data-toggle="' + node.id + '" role="button" tabindex="0"' : '') + '>' +
          '<div class="avatar root-avatar">' + escapeHtml(node.initials||'OT') + '</div>' +
          '<div class="root-title">' + escapeHtml(node.name) + '</div>' +
          (hasKids ?
            '<div class="meta-row" style="justify-content:center;">' +
              '<span class="reports-badge">' + svgPeople() + node.children.length + svgChevron(isOpen) + '</span>' +
            '</div>' : '') +
        '</div>';
    }

    var eyebrow = node.dept ? '<div class="eyebrow">' + escapeHtml(node.dept) + '</div>' : '';
    var role = node.role ? '<div class="role">' + escapeHtml(node.role) + '</div>' : '';
    var email = node.email ? '<div class="email">' + escapeHtml(node.email) + '</div>' : '';
    var yearsPill = node.years ?
      '<span class="years-pill">' + escapeHtml(node.years) + '</span>' :
      '<span class="years-pill placeholder">—</span>';
    var badge = hasKids ?
      '<span class="reports-badge">' + svgPeople() + node.children.length + svgChevron(isOpen) + '</span>' :
      '<span></span>';

    return '' +
      '<div class="card' + (hasKids ? ' clickable' : '') + (isMatch ? ' is-match' : '') + '" ' +
        (hasKids ? 'data-toggle="' + node.id + '" role="button" tabindex="0"' : '') +
        ' data-id="' + node.id + '">' +
        '<div class="avatar">' + escapeHtml(node.initials||'?') + '</div>' +
        eyebrow +
        '<div class="name">' + escapeHtml(node.name) + '</div>' +
        role +
        email +
        '<div class="meta-row">' + yearsPill + badge + '</div>' +
      '</div>';
  }

  function escapeHtml(s){
    return (s||'').toString()
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function renderNode(node, isRoot){
    var hasKids = node.children && node.children.length > 0;
    var isOpen = isRoot ? true : (!!expanded[node.id] || (query && forcedOpen[node.id]));
    var li = document.createElement('li');
    li.className = 'node' + (isRoot ? ' is-root' : '');
    li.innerHTML = renderCard(node, isRoot);

    if(hasKids && isOpen){
      var ul = document.createElement('ul');
      node.children.forEach(function(child){
        ul.appendChild(renderNode(child, false));
      });
      li.appendChild(ul);
    }
    return li;
  }

  var treeEl = document.getElementById('tree');
  function draw(){
    treeEl.innerHTML = '';
    treeEl.appendChild(renderNode(DATA, true));
  }
  draw();

  // center the tree horizontally on first load, so it doesn't open cropped
  (function centerInitialScroll(){
    var canvasEl = document.getElementById('canvas');
    requestAnimationFrame(function(){
      var wrapWidth = document.getElementById('zoomWrap').scrollWidth;
      canvasEl.scrollLeft = Math.max(0, (wrapWidth - canvasEl.clientWidth) / 2);
    });
  })();

  // ---- toggle expand/collapse ----
  treeEl.addEventListener('click', function(e){
    var target = e.target.closest('[data-toggle]');
    if(!target) return;
    var id = target.getAttribute('data-toggle');
    if(query){
      // while searching, toggling manually overrides the forced-open state
      forcedOpen[id] = !( !!expanded[id] || forcedOpen[id] );
      expanded[id] = forcedOpen[id];
    } else {
      expanded[id] = !expanded[id];
    }
    draw();
  });
  treeEl.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    var target = e.target.closest('[data-toggle]');
    if(!target) return;
    e.preventDefault();
    target.click();
  });

  // ---- expand / collapse all ----
  document.getElementById('expandAllBtn').addEventListener('click', function(){
    idsWithChildren.forEach(function(id){ expanded[id] = true; });
    draw();
  });
  document.getElementById('collapseAllBtn').addEventListener('click', function(){
    expanded = {}; expanded[ROOT_ID] = true;
    draw();
  });

  // ---- download the whole org chart, as a multi-page PDF or as one PNG image ----
  var pdfBtn = document.getElementById('downloadPdfBtn');
  var pdfBtnLabel = pdfBtn.innerHTML;
  var pngBtn = document.getElementById('downloadPngBtn');
  var pngBtnLabel = pngBtn.innerHTML;
  var pdfStatus = document.getElementById('pdfStatus');

  function setPdfStatus(msg, isError){
    if(!pdfStatus) return;
    pdfStatus.textContent = msg || '';
    pdfStatus.hidden = !msg;
    pdfStatus.style.color = isError ? '#D14343' : 'var(--text-muted)';
  }

  // expands every node, renders it at natural (unzoomed) size and rasterizes it
  // with html2canvas; resolves with the resulting <canvas>. Shared by both export buttons.
  function captureFullChart(){
    idsWithChildren.forEach(function(id){ expanded[id] = true; });
    draw();
    var wrap = document.getElementById('zoomWrap');
    var prevTransform = wrap.style.transform;
    wrap.style.transform = 'none';
    document.body.classList.add('pdf-exporting');

    function restore(){
      wrap.style.transform = prevTransform;
      document.body.classList.remove('pdf-exporting');
    }

    return new Promise(function(resolve, reject){
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ setTimeout(function(){
        var naturalW = wrap.scrollWidth;
        var naturalH = wrap.scrollHeight;
        // cap total captured pixels so the browser doesn't run out of canvas memory
        var MAX_PIXELS = 42000000; // ~42MP, safe for a desktop browser's memory
        // html2canvas's own render buffer silently comes back blank (no error) once a side
        // exceeds the browser's real canvas-size ceiling (measured at exactly 65535px in
        // Chromium); cap well under that so the capture always actually renders.
        var MAX_DIM = 60000;
        var renderScale = Math.min(1, Math.sqrt(MAX_PIXELS / (naturalW * naturalH)), MAX_DIM / naturalW, MAX_DIM / naturalH);

        html2canvas(wrap, {
          scale: renderScale,
          backgroundColor: getComputedStyle(document.body).backgroundColor || '#ffffff',
          useCORS: true,
          logging: false,
          width: naturalW,
          height: naturalH,
          windowWidth: naturalW,
          windowHeight: naturalH,
          scrollX: 0,
          scrollY: 0
        }).then(function(canvas){
          restore();
          resolve(canvas);
        }).catch(function(err){
          restore();
          reject(err);
        });
      }, 150); }); });
    });
  }
  pdfBtn.addEventListener('click', function(){
    if(typeof html2canvas === 'undefined' || !window.jspdf){
      setPdfStatus('No se pudo cargar el generador de PDF (revisá tu conexión).', true);
      return;
    }
    pdfBtn.disabled = true; pngBtn.disabled = true;
    pdfBtn.innerHTML = 'Generando PDF…';
    setPdfStatus('Expandiendo las ' + totalPeople + ' personas y armando el PDF. Con el organigrama completo puede tardar un minuto y salir en varias páginas, como un póster.');

    captureFullChart().then(function(canvas){
      buildPosterPdf(canvas);
      setPdfStatus('Listo. Revisá la carpeta de descargas de tu navegador.');
      pdfBtn.disabled = false; pngBtn.disabled = false;
      pdfBtn.innerHTML = pdfBtnLabel;
    }).catch(function(err){
      pdfBtn.disabled = false; pngBtn.disabled = false;
      pdfBtn.innerHTML = pdfBtnLabel;
      setPdfStatus('No se pudo generar el PDF en este navegador. Probá cerrando otras pestañas o desde una compu de escritorio.', true);
    });
  });

  // The master canvas from captureFullChart() is one very wide, very short
  // strip (this chart is far wider than it is tall — one big fan-out row of
  // people). Saved as-is, that's technically a valid PNG, but opened in any
  // normal image viewer it looks like a blank sliver: viewers fit the whole
  // image to the window, and a 100:1 aspect ratio leaves each row a few
  // pixels tall on screen. So instead of saving the strip directly, we cut
  // it into N equal vertical slices and stack those slices on top of each
  // other — same idea as the PDF's poster pages, but composited into one
  // image instead of split across files. Read it back the same way: left to
  // right within a band, then down to the next band, like lines of text.
  function buildGridPng(canvas){
    var targetAspect = 1.5; // roughly landscape-poster shaped, comfortable to view
    var bands = Math.max(1, Math.round(Math.sqrt(canvas.width / (targetAspect * canvas.height))));
    var bandW = Math.ceil(canvas.width / bands);
    var gap = Math.max(2, Math.round(canvas.height * 0.02));
    var labelH = Math.max(18, Math.round(canvas.height * 0.05));

    var out = document.createElement('canvas');
    out.width = bandW;
    out.height = (canvas.height + labelH + gap) * bands - gap;
    var ctx = out.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, out.width, out.height);

    for(var i = 0; i < bands; i++){
      var sx = i * bandW;
      var sw = Math.min(bandW, canvas.width - sx);
      if(sw <= 0) break;
      var destY = i * (canvas.height + labelH + gap);
      ctx.fillStyle = '#F3F4F7';
      ctx.fillRect(0, destY, out.width, labelH);
      ctx.fillStyle = '#6B7280';
      ctx.font = Math.max(11, Math.round(labelH * 0.55)) + 'px sans-serif';
      ctx.textBaseline = 'middle';
      ctx.fillText('Organigrama Terragene · fila ' + (i + 1) + ' de ' + bands + ' (izquierda a derecha, sigue en la fila de abajo)', 10, destY + labelH / 2);
      ctx.drawImage(canvas, sx, 0, sw, canvas.height, 0, destY + labelH, sw, canvas.height);
      if(i < bands - 1){
        ctx.fillStyle = '#D3D7E0';
        ctx.fillRect(0, destY + labelH + canvas.height, out.width, gap);
      }
    }
    return out;
  }

  pngBtn.addEventListener('click', function(){
    if(typeof html2canvas === 'undefined'){
      setPdfStatus('No se pudo cargar el generador de imagen (revisá tu conexión).', true);
      return;
    }
    pdfBtn.disabled = true; pngBtn.disabled = true;
    pngBtn.innerHTML = 'Generando imagen…';
    setPdfStatus('Expandiendo las ' + totalPeople + ' personas y armando una imagen PNG. Va a salir como un póster en varias filas (se lee de izquierda a derecha y de arriba a abajo), para verla bien conviene hacer zoom.');

    captureFullChart().then(function(canvas){
      var pngCanvas = buildGridPng(canvas);
      pngCanvas.toBlob(function(blob){
        if(!blob){
          setPdfStatus('No se pudo generar la imagen en este navegador.', true);
          pdfBtn.disabled = false; pngBtn.disabled = false;
          pngBtn.innerHTML = pngBtnLabel;
          return;
        }
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'organigrama-terragene.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
        setPdfStatus('Listo. Revisá la carpeta de descargas de tu navegador.');
        pdfBtn.disabled = false; pngBtn.disabled = false;
        pngBtn.innerHTML = pngBtnLabel;
      }, 'image/png');
    }).catch(function(err){
      pdfBtn.disabled = false; pngBtn.disabled = false;
      pngBtn.innerHTML = pngBtnLabel;
      setPdfStatus('No se pudo generar la imagen en este navegador. Probá cerrando otras pestañas o desde una compu de escritorio.', true);
    });
  });

  function buildPosterPdf(canvas){
    var jsPDFCtor = window.jspdf.jsPDF;
    var format = 'a3', orientation = 'landscape';
    var doc = new jsPDFCtor({orientation: orientation, unit: 'pt', format: format, compress: true});
    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var margin = 24;
    var usableW = pageW - margin * 2;
    var usableH = pageH - margin * 2 - 14; // leave room for the footer label
    var pxPerPt = 2; // ~144dpi print resolution

    var tileWpx = Math.floor(usableW * pxPerPt);
    var tileHpx = Math.floor(usableH * pxPerPt);
    var cols = Math.max(1, Math.ceil(canvas.width / tileWpx));
    var rows = Math.max(1, Math.ceil(canvas.height / tileHpx));

    var tileCanvas = document.createElement('canvas');
    var ctx = tileCanvas.getContext('2d');
    var pageNum = 0, totalPages = rows * cols;

    for(var r = 0; r < rows; r++){
      for(var c = 0; c < cols; c++){
        var sx = c * tileWpx, sy = r * tileHpx;
        var sw = Math.min(tileWpx, canvas.width - sx);
        var sh = Math.min(tileHpx, canvas.height - sy);
        if(sw <= 0 || sh <= 0) continue;
        tileCanvas.width = sw; tileCanvas.height = sh;
        ctx.clearRect(0, 0, sw, sh);
        ctx.drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
        var imgData = tileCanvas.toDataURL('image/jpeg', 0.88);
        pageNum++;
        if(pageNum > 1) doc.addPage(format, orientation);
        doc.addImage(imgData, 'JPEG', margin, margin, sw / pxPerPt, sh / pxPerPt);
        doc.setFontSize(8);
        doc.setTextColor(140);
        doc.text(
          'Organigrama Terragene · página ' + pageNum + ' de ' + totalPages + ' (fila ' + (r + 1) + ', columna ' + (c + 1) + ') · armá el póster ordenando las páginas en esta grilla',
          margin, pageH - 10
        );
      }
    }
    doc.save('organigrama-terragene.pdf');
  }

  // ---- search ----
  var searchInput = document.getElementById('searchInput');
  var searchCount = document.getElementById('searchCount');
  var searchClear = document.getElementById('searchClear');

  function ancestorsOf(id){
    var chain = [];
    var n = byId[id];
    var visited = {};
    // build parent map lazily
    if(!ancestorsOf._parentMap){
      var pm = {};
      (function walk(node){
        (node.children||[]).forEach(function(c){ pm[c.id] = node.id; walk(c); });
      })(DATA);
      ancestorsOf._parentMap = pm;
    }
    var cur = ancestorsOf._parentMap[id];
    while(cur){
      chain.push(cur);
      cur = ancestorsOf._parentMap[cur];
    }
    return chain;
  }

  function runSearch(){
    query = searchInput.value.trim();
    matchIds = {};
    forcedOpen = {};
    searchClear.hidden = !query;

    if(!query){
      searchCount.hidden = true;
      draw();
      return;
    }
    var q = norm(query);
    var count = 0;
    allIds.forEach(function(id){
      if(id === ROOT_ID) return;
      var n = byId[id];
      var hay = norm(n.name) + ' ' + norm(n.role) + ' ' + norm(n.dept) + ' ' + norm(n.email);
      if(hay.indexOf(q) !== -1){
        matchIds[id] = true;
        count++;
        forcedOpen[id] = true;
        ancestorsOf(id).forEach(function(a){ forcedOpen[a] = true; });
      }
    });
    searchCount.hidden = false;
    searchCount.textContent = count === 0 ? 'Sin resultados' : (count + (count===1 ? ' resultado' : ' resultados'));
    draw();

    if(count > 0){
      requestAnimationFrame(function(){
        var el = treeEl.querySelector('.is-match');
        if(el) el.scrollIntoView({block:'center', inline:'center', behavior:'smooth'});
      });
    }
  }

  var searchTimer = null;
  searchInput.addEventListener('input', function(){
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 120);
  });
  searchClear.addEventListener('click', function(){
    searchInput.value = '';
    runSearch();
    searchInput.focus();
  });

  // ---- zoom ----
  var zoom = 1;
  var zoomWrap = document.getElementById('zoomWrap');
  var zoomLevel = document.getElementById('zoomLevel');
  function applyZoom(){
    zoomWrap.style.transform = 'scale(' + zoom + ')';
    zoomLevel.textContent = Math.round(zoom*100) + '%';
  }
  document.getElementById('zoomIn').addEventListener('click', function(){
    zoom = Math.min(1.5, +(zoom + 0.1).toFixed(2)); applyZoom();
  });
  document.getElementById('zoomOut').addEventListener('click', function(){
    zoom = Math.max(0.3, +(zoom - 0.1).toFixed(2)); applyZoom();
  });
  document.getElementById('zoomReset').addEventListener('click', function(){
    zoom = 1; applyZoom();
    document.getElementById('canvas').scrollTo({top:0,left:0});
  });
  applyZoom();
})();
</script>
